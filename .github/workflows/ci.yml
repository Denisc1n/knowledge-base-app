name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KnowledgeBase.slnx

      - name: Build API
        run: dotnet build src/KnowledgeBase.Api/KnowledgeBase.Api.csproj --configuration Release --no-restore

      - name: Run Application Unit Tests
        run: dotnet test tests/KnowledgeBase.Application.UnitTests/KnowledgeBase.Application.UnitTests.csproj --configuration Release --no-restore

      - name: Run API Integration Tests
        run: dotnet test tests/KnowledgeBase.Api.IntegrationTests/KnowledgeBase.Api.IntegrationTests.csproj --configuration Release --no-restore
